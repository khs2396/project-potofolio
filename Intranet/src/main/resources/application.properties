spring.application.name=Intranet

# JSON 직렬화 네이밍 전략 (camelCase)
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE

# 파일 업로드 용량 제한 설정
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# DB 설정
spring.datasource.url=
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=
spring.datasource.password=
project.upload.path=D:/CdW/static/storage
project.upload.path2=D:/CdW/static/storage2

# UTF-8 응답 강제
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# CORS 허용 origin 목록(쉼표로 구분)
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174

# 메일 발송 설정 (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# 메일 발신자 기본값
mail.from.address=${spring.mail.username}
mail.from.name=KG Intranet
