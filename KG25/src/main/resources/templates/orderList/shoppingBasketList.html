<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script type="text/javascript">
	function checkDelete(button) {
		const pdname = button.getAttribute('data-pdname');
		if (confirm("장바구니에서 삭제할까요?")) {
			location.href = "/shoppingBasketDelete?pg=[[${pg}]]&pdname="
					+ encodeURIComponent(pdname);
		}
	}

	function checkOrdering() {
		if (confirm("발주를 넣을까요?")) {
			location.href = "/orderListPurchase?totalAmount=[[${totalAmount}]]";
		}
	}
</script>

<style type="text/css">
.paging {
	color: black;
	text-decoration: none;
}

.currentPaging {
	color: blue;
	text-decoration: underline;
}

.delete {
	background-color: #3399ff; /* 선명한 하늘색 */
	border: none;
	color: white;
	padding: 8px 14px;
	font-weight: bold;
	border-radius: 6px;
	cursor: pointer;
	box-shadow: 0 3px 6px rgba(51, 153, 255, 0.5);
	transition: background-color 0.3s ease, box-shadow 0.3s ease;
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.delete:hover {
	background-color: #1a75ff; /* 진한 파란색으로 변함 */
	box-shadow: 0 5px 10px rgba(26, 117, 255, 0.6);
}

.delete:active {
	transform: scale(0.95);
	box-shadow: 0 2px 4px rgba(26, 117, 255, 0.4);
}

table.table {
	width: 100%;
	border-collapse: collapse;
}

table.table th, table.table td {
	padding: 8px 12px;
	text-align: center; /* 가로 중앙 정렬 */
	vertical-align: middle; /* 세로 중앙 정렬 */
	border: none; /* ← 테두리 없앰 */
	background-color: transparent; /* 배경색도 제거 */
}

table.table thead {
	background-color: #fddf83; /* table-warning 비슷하게 */
}

.welcome-msg {
	font-size: 10px;
	margin: 0;
	padding-top: 4px;
	color: #555;
}

.menu-table {
	background-color: #fffbea;
	border-radius: 8px;
	padding: 10px;
	margin-bottom: 30px;
}

.menu-table td {
	padding: 15px 10px;
	text-align: center;
	font-size: 14px;
}

.menu-link {
	display: inline-block;
	width: 100%;
	padding: 10px;
	border-radius: 6px;
	background-color: #f8f9fa;
	transition: all 0.3s ease;
	color: #212529;
	font-weight: 500;
	text-decoration: none;
}

.menu-link:hover {
	background-color: #ffd43b;
	color: #000;
	text-decoration: none;
}

.menu-link i {
	margin-right: 6px;
}

.section-title {
	font-weight: bold;
	font-size: 16px;
	margin-bottom: 10px;
}

/* 장바구니 테이블 꾸미기 */
.shopping-table {
	width: 100%;
	border-collapse: separate;
	border-spacing: 0;
	box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
	margin: auto;
	background-color: #fff;
	border-radius: 10px;
	overflow: hidden;
}

.shopping-table th {
	background-color: #fddf83;
	padding: 12px;
	font-weight: bold;
	color: #333;
	border-bottom: 1px solid #ddd;
}

.shopping-table td {
	padding: 12px;
	border-bottom: 1px solid #eee;
	color: #333;
	background-color: #fff;
}

.shopping-table tr:hover td {
	background-color: #fff5d7;
	transition: background-color 0.3s ease;
}

/* 총액과 버튼 영역 스타일 */
.order-summary {
	text-align: center;
	margin: 30px 0 50px 0;
	font-size: 18px;
	font-weight: 500;
}

.order-summary strong {
	color: #e67e22;
	font-size: 20px;
}

.order-button {
	background-color: #28a745;
	color: white;
	border: none;
	padding: 10px 18px;
	font-size: 15px;
	border-radius: 6px;
	cursor: pointer;
	margin-left: 20px;
	transition: background-color 0.3s ease;
}

.order-button:hover {
	background-color: #218838;
}


</style>
</head>
<body>

	<div class="container" style="width: 800px; margin: auto;">
		<div th:replace="~{layouts/header.html}"></div>

		<!-- 💡 로그인 필요없는 메뉴 -->
		<div class="menu-table">
			<div class="section-title">🔓 일반 메뉴</div>
			<table class="table mb-0">
				<tr>
					<td><th:block th:if="${session.managerId == null}">
							<a href="loginForm" class="menu-link"> <i
								class="fas fa-sign-in-alt"></i> 로그인
							</a>
						</th:block> <th:block th:if="${session.managerId != null}">
							<a href="logout" class="menu-link"> <i
								class="fas fa-sign-out-alt"></i> 로그아웃
							</a>
							<p class="welcome-msg mt-1 mb-0" style="font-size: 11px;">
								<th:block th:if="${session.code > 0}">
              관리자 [[${session.managerId}]]님 환영합니다.
            </th:block>
								<th:block th:if="${session.code == 0}">
              회원 [[${session.managerId}]]님 환영합니다.
            </th:block>
							</p>
						</th:block></td>
					<td><a href="mapSearchForm" class="menu-link"> <i
							class="fas fa-map-marker-alt"></i> 점포찾기
					</a></td>
					<td><a href="introduceForm" class="menu-link"> <i
							class="fas fa-building"></i> 회사소개
					</a></td>
					<td><a href="noticeList" class="menu-link"> <i
							class="fas fa-bullhorn"></i> 공지사항
					</a></td>
					<td><a href="helpForm" class="menu-link"> <i
							class="fas fa-headset"></i> 고객센터
					</a></td>
				</tr>
			</table>
		</div>

		
			<h2 style="text-align: center;">장바구니</h2>
			<table class="shopping-table">
				<thead>
					<tr>
						<th>상품명</th>
						<th>카테고리</th>
						<th>수량</th>
						<th>가격</th>
						<th>총합</th>
						<th>삭제</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="item : ${list}">
						<td th:text="${item.pdname}"></td>
						<td th:text="${item.cat}"></td>
						<td th:text="${item.qty}"></td>
						<td th:text="${item.price}"></td>
						<td th:text="${item.total}"></td>
						<td>
							<input class="delete" type="button" value="지우기"
								th:attr="data-pdname=${item.pdname}" onclick="checkDelete(this)">
						</td>
					</tr>
					
				<!-- 🧩 항목이 5개보다 적으면 빈 줄로 채움 -->
				<tr th:if="${list != null and list.size() < 5}"
					th:each="i : ${#numbers.sequence(1, 5 - list.size())}">
					<td>&nbsp;</td>
					<td></td>
					<td></td>
					<td></td>
					<td></td>
					<td></td>
				</tr>
			</tbody>
			
			<!-- 📄 페이징 영역 -->
			<th:block th:if="${list != null and !list.isEmpty()}">
			<div style="text-align: center; margin-top: 15px;">
				<tr align="center">
					<td colspan="6"><th:block th:if="${startPage > 3}">
							<a class="paging"
								th:href="@{shoppingBasketList(pg=${startPage-1})}">이전</a>&nbsp;&nbsp;
														</th:block> <th:block
							th:each="i : ${#numbers.sequence(startPage, endPage)}">
							<a th:class="${pg == i} ? currentPaging:paging"
								th:href="@{shoppingBasketList(pg=${i})}">[[${i}]]</a>&nbsp;&nbsp;
					     									</th:block> <th:block th:if="${endPage < totalP}">
							<a class="paging"
								th:href="@{shoppingBasketList(pg=${endPage+1})}">다음</a>
						</th:block></td>
				</tr>
			</div>	
			</th:block>
			</table>




		<div class="order-summary">
			총액: <strong th:text="${totalAmount}">0</strong> 원

			<form method="post" action="order" style="display: inline;">
				<input type="button" value="발주하기" class="order-button"
					onclick="checkOrdering()">
			</form>
		</div>

		<div class="menu-table" style="background-color: #e3f7ff;">
			<div class="section-title">🔐 로그인 후 이용 가능</div>
			<table class="table mb-0">
				<tr>
					<td><a onclick="location.href='mypage'" class="menu-link">
							<i class="fas fa-user-circle"></i> 마이페이지
					</a></td>
					<td><a onclick="location.href='shoppingBasketList'"
						class="menu-link"> <i class="fas fa-shopping-cart"></i> 장바구니
					</a></td>
					<td><a onclick="location.href='productList'" class="menu-link">
							<i class="fas fa-boxes"></i> 상품발주
					</a></td>
					<td><a onclick="location.href='orderingList'"
						class="menu-link"> <i class="fas fa-clipboard-list"></i> 발주현황
					</a></td>
				</tr>
			</table>
		</div>

		<div th:replace="~{layouts/footer.html}"></div>
	</div>
</body>
</html>
