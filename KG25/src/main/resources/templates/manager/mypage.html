<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style type="text/css">
.info {
	text-decoration: none;
	color: black;
	transition: transform 0.2s ease; /* 부드럽게 변형 */
	display: inline-block; /* transform 적용 위해 필요 */
}

.info:hover {
	transform: scale(1.1); /* 10% 확대 */
}

/* 로그인 버튼 스타일 */
.login {
  background-color: #66b3ff; /* 연한 파란색으로 변경 */
  color: white;
  border: none;
  padding: 10px 25px;
  border-radius: 5px;
  cursor: pointer;
  transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
  font-size: 16px;
  font-weight: 600;
}

.login:hover {
  transform: scale(1.05);
  background-color: #3399ff; /* hover 시 조금 더 진한 파란색 */
  box-shadow: 0 4px 10px rgba(0, 86, 179, 0.4);
}

.logx {
	color: black;
	text-decoration: none;
}

.logx:hover {
	color: blue;
	text-decoration: underline;
}

table.table th, table.table td {
	padding: 8px 12px;
	text-align: center; /* 가로 중앙 정렬 */
	vertical-align: middle; /* 세로 중앙 정렬 */
	border: 1px solid #ddd; /* 셀 테두리 */
}

table.table thead {
	background-color: #fddf83; /* table-warning 비슷하게 */
}

table.table {
	width: 100%;
	border-collapse: collapse;
}

table.table th, table.table td {
	padding: 8px 12px;
	text-align: center; /* 가로 중앙 정렬 */
	vertical-align: middle; /* 세로 중앙 정렬 */
	border: none; /* ← 테두리 없앰 */
	background-color: transparent; /* 배경색도 제거 */
}

table.table thead {
	background-color: #fddf83; /* table-warning 비슷하게 */
}

.logx {
	color: black;
	text-decoration: none;
}

.logx:hover {
	color: blue;
	text-decoration: underline;
}

.welcome-msg {
	font-size: 10px;
	margin: 0;
	padding-top: 4px;
	color: #555;
}

.menu-table {
	background-color: #fffbea;
	border-radius: 8px;
	padding: 10px;
	margin-bottom: 30px;
}

.menu-table td {
	padding: 15px 10px;
	text-align: center;
	font-size: 14px;
}

.menu-link {
	display: inline-block;
	width: 100%;
	padding: 10px;
	border-radius: 6px;
	background-color: #f8f9fa;
	transition: all 0.3s ease;
	color: #212529;
	font-weight: 500;
	text-decoration: none;
}

.menu-link:hover {
	background-color: #ffd43b;
	color: #000;
	text-decoration: none;
}

.menu-link i {
	margin-right: 6px;
}

.section-title {
	font-weight: bold;
	font-size: 16px;
	margin-bottom: 10px;
}
</style>
</head>
<body>
	<div class="container" style="width: 800px; margin: auto;">
		<div th:replace="~{layouts/header.html}"></div>

		<!-- 💡 로그인 필요없는 메뉴 -->
		<div class="menu-table">
			<div class="section-title">🔓 일반 메뉴</div>
			<table class="table mb-0">
				<tr>
					<td><th:block th:if="${session.managerId == null}">
							<a href="loginForm" class="menu-link"> <i
								class="fas fa-sign-in-alt"></i> 로그인
							</a>
						</th:block> <th:block th:if="${session.managerId != null}">
							<a href="logout" class="menu-link"> <i
								class="fas fa-sign-out-alt"></i> 로그아웃
							</a>
							<p class="welcome-msg mt-1 mb-0" style="font-size: 11px;">
								<th:block th:if="${session.code > 0}">
              관리자 [[${session.managerId}]]님 환영합니다.
            </th:block>
								<th:block th:if="${session.code == 0}">
              회원 [[${session.managerId}]]님 환영합니다.
            </th:block>
							</p>
						</th:block></td>
					<td><a href="mapSearchForm" class="menu-link"> <i
							class="fas fa-map-marker-alt"></i> 점포찾기
					</a></td>
					<td><a href="introduceForm" class="menu-link"> <i
							class="fas fa-building"></i> 회사소개
					</a></td>
					<td><a href="noticeList" class="menu-link"> <i
							class="fas fa-bullhorn"></i> 공지사항
					</a></td>
					<td><a href="helpForm" class="menu-link"> <i
							class="fas fa-headset"></i> 고객센터
					</a></td>
				</tr>
			</table>
		</div>
		<h3 style="text-align: center; margin-bottom: 20px;">마이페이지</h3>

<table class="table" style="width: 100%; background-color: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.05); border-radius: 8px; overflow: hidden;">
	<tr style="background-color: #f0f0f0;">
		<th style="width: 100px; text-align: left; padding: 12px;">아이디</th>
		<td style="padding: 12px;">[[${id}]]</td>
		<td colspan="2" rowspan="6" style="text-align: center;">
			<img alt="프로필 이미지" src="/img/index.jpg" width="350" style="border-radius: 10px;">
		</td>
	</tr>
	<tr>
		<th style="text-align: left; padding: 12px;">이름</th>
		<td style="padding: 12px;">[[${name}]]</td>
	</tr>
	<tr>
		<th style="text-align: left; padding: 12px;">주소</th>
		<td style="padding: 12px;">[[${manager.addr}]]</td>
	</tr>
	<tr>
		<th style="text-align: left; padding: 12px;">전화번호</th>
		<td style="padding: 12px;">[[${manager.tel}]]</td>
	</tr>
	<tr>
		<th style="text-align: left; padding: 12px;">직급</th>
		<td style="padding: 12px;">
			<th:block th:if="${manager.code > 0}">
				본사직원
			</th:block>
			<th:block th:if="${manager.code == 0}">
				지점장
			</th:block>
		</td>
	</tr>
	<tr>
		<td colspan="2" align="center">
			<input type="button" value="정보 변경" th:data-id="${id}" onclick="openPwAndTelCheckPopup()" class="login">
		</td>
	</tr>


</table>

<div class="menu-table" style="background-color: #e3f7ff;">
         <div class="section-title">🔐 로그인 후 이용 가능</div>
         <table class="table mb-0">
            <tr>
               <td><a onclick="location.href='mypage'" class="menu-link"> <i
                     class="fas fa-user-circle"></i> 마이페이지
               </a></td>
               <td><a onclick="location.href='shoppingBasketList'" class="menu-link"> <i
                     class="fas fa-shopping-cart"></i> 장바구니
               </a></td>
               <td><a onclick="location.href='productList'" class="menu-link"> <i
                     class="fas fa-boxes"></i> 상품발주
               </a></td>
               <td><a onclick="location.href='orderingList'" class="menu-link"> <i
                     class="fas fa-clipboard-list"></i> 발주현황
               </a></td>
            </tr>
         </table>
      </div>

		<div th:replace="~{layouts/footer.html}"></div>
	</div>
	<script th:inline="javascript">
	/*<![CDATA[*/
		function openPwAndTelCheckPopup() {
			  const id = /*[[${session.managerId}]]*/ '';
			  const width = 600;
			  const height = 500;
			  const left = (window.screen.width / 2) - (width / 2);
			  const top = (window.screen.height / 2) - (height / 2);
			
			  window.open(
			    '/checkPwAndTelForm?id=' + id,
			    'checkPwAndTelPopup',
			    `width=${width},height=${height},left=${left},top=${top},resizable=no,scrollbars=no`
			  );
			}
			
			// 🔹 비밀번호 변경용 팝업
			function openPwCheckPopupForChangePw() {
			  const id = /*[[${session.managerId}]]*/ '';
			  const width = 500;
			  const height = 300;
			  const left = (window.screen.width / 2) - (width / 2);
			  const top = (window.screen.height / 2) - (height / 2);
			
			  window.open(
			    '/checkPwForm?target=changePw&id=' + id,
			    'checkPwPopup',
			    `width=${width},height=${height},left=${left},top=${top},resizable=no`
			  );
			}
			
			// 🔹 회원 탈퇴용 팝업
			function openPwCheckPopupForDelete() {
			  const id = /*[[${session.managerId}]]*/ '';
			  const width = 400;
			  const height = 300;
			  const left = (window.screen.width / 2) - (width / 2);
			  const top = (window.screen.height / 2) - (height / 2);
			
			  window.open(
			    '/checkPwForm?target=delete&id=' + id,
			    'checkPwPopup',
			    `width=${width},height=${height},left=${left},top=${top},resizable=no`
			  );
			}
		/*]]>*/
</script>
</body>
</html>
