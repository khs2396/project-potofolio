<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>비밀번호 확인</title>
<style>
body {
	font-family: Arial;
	text-align: center;
	margin-top: 40px;
}

input[type=password] {
	padding: 6px;
	width: 80%;
	margin-bottom: 10px;
}

input[type=button], input[type=reset] {
	padding: 6px 14px;
	background-color: #007BFF;
	color: white;
	border: none;
	border-radius: 4px;
	cursor: pointer;
}

input[type=button]:hover {
	background-color: #0056b3;
}
</style>
</head>
<body>
	<h4>비밀번호를 입력해주세요.</h4>
	<form name="pwForm" method="post" action="/checkPw">
		<input type="hidden" name="id" th:value="${param.id}"> <input
			type="hidden" name="target" th:value="${param.target}"> <input
			type="password" name="pw" placeholder="비밀번호 입력"><br> <input
			type="button" value="확인" onclick="checkPw()"> <input
			type="reset" value="취소">
	</form>

	<script>
		function checkPw() {
			const form = document.pwForm;
			if (!form.pw.value) {
				alert("비밀번호를 입력하세요.");
				return;
			}
			form.submit();
		}
	</script>
</body>
</html>
