<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script type="text/javascript" src="/js/managerScript.js?v=1"></script>

<!-- ✔️ 에러 메시지 있으면 alert 띄우기 -->
<script th:if="${error != null}" th:inline="javascript">
    alert(/*[[${error}]]*/ '정보가 올바르지 않습니다. 다시 입력해주세요.');
</script>
<style>
input[type="button"].btn {
  background-color: #66b3ff; /* 연한 파란색으로 변경 */
  color: white;
  border: none;
  padding: 10px 25px;
  border-radius: 5px;
  cursor: pointer;
  transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
  font-size: 16px;
  font-weight: 600;
}

input[type="button"].btn:hover {
  transform: scale(1.05);
  background-color: #3399ff; /* hover 시 조금 더 진한 파란색 */
  box-shadow: 0 4px 10px rgba(0, 86, 179, 0.4);
}

input[type="reset"].btn {
  background-color: #66b3ff; /* 연한 파란색으로 변경 */
  color: white;
  border: none;
  padding: 10px 25px;
  border-radius: 5px;
  cursor: pointer;
  transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
  font-size: 16px;
  font-weight: 600;
}

input[type="reset"].btn:hover {
  transform: scale(1.05);
  background-color: #3399ff; /* hover 시 조금 더 진한 파란색 */
  box-shadow: 0 4px 10px rgba(0, 86, 179, 0.4);
}

</style>
</head>
<body>
	<div th:replace="~{layouts/header.html}"></div>
	
	<div>	
		<h4 align="center">비밀번호와 전화번호를 한번 더 입력해주세요.</h4>
		<form action="checkPwAndTel" name="frm" method="post">
			<input type="hidden" name="id" th:value="${id}">
			<table class="table" style="width: 360px; margin: auto;">			
				<tr>
					<td>비밀번호</td>
					<td>
						<input type="password" name="pw">
					</td>
				</tr>
				
				<tr>
					<td>전화번호</td>
					<td>
						<input type="text" name="tel" placeholder="-없이 입력해주세요">
					</td>
				</tr>
				
				<tr>
					<td colspan="2" style="text-align: center;">
						<input class="btn" type="button" value="확인" onclick="checkPwAndTel()">
						<input class="btn" type="reset" value="다시 입력">
					</td>
				</tr>
			</table>
		</form>
	</div>

	<div th:replace="~{layouts/footer.html}"></div>
</body>
</html>
