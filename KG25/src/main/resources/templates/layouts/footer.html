<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Footer</title>
<!-- Bootstrap 5 CSS -->
<link
   href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
   rel="stylesheet">
<style>
.footer {
   background-color: #f1f3f5; /* 연한 회색 배경 */
   color: #343a40; /* 어두운 텍스트 */
   padding: 10px 0;
   font-size: 14px;
   height: 120px;
}

.footer a {
   color: #495057; /* 중간 회색 링크 */
   text-decoration: none;
}

.footer a:hover {
   color: #212529; /* 진한 회색 */
   text-decoration: underline;
}

p {
   font-size: 12px;
}

.footer p {
   margin: 2px 0; /* 위아래 여백 줄임 */
   line-height: 1.2; /* 줄 간격 줄임 */
   letter-spacing: -0.3px; /* 자간 줄이기 (선택사항) */
   font-size: 12px;
}
</style>
</head>
<body>
   <div th:fragment="footer" style="margin-top: 100px;">
      <footer class="footer mt-auto">
         <div class="container">
            <div class="row">
               <div class="col-md-4">
                  <h6>고객센터</h6>
                  <p>📞 080-999-9999</p>
                  <p>운영시간: 09:00 ~ 18:00 (주말/공휴일 제외)</p>
               </div>
               <div class="col-md-4">
                  <h6>회사 정보</h6>
                  <p>상호: KG편의점</p>
                  <p>사업자등록번호: 123-45-67890</p>
                  <p>대표: 홍길동</p>
               </div>
               <div class="col-md-4">
                  <h6>주소</h6>
                  <p>서울특별시 강남구 논현로 508 KG25 본사</p>
                  <p>이메일: support@kgmart.co.kr</p>
               </div>
            </div>
            <hr style="border-top: 1px solid #ced4da;">
            <p class="text-center">© 2025 KG25. All Rights Reserved.</p>
         </div>
      </footer>
   </div>
</body>
</html>
