<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script type="text/javascript">
	function really(frm) {
		const qty = parseInt(frm.qty.value);

		if (isNaN(qty) || qty < 1 || qty > 999) {
			alert("수량은 1~999 사이의 숫자만 입력 가능합니다.");
			return false;
		}
		

		if (confirm("정말로 구매하시겠습니까?")) {
			frm.submit();
		} else {
			return false;
		}
	}

	function inputCheck(frm) {
		const qty = parseInt(frm.qty.value);

		if (isNaN(qty) || qty < 1 || qty > 999) {
			alert("수량은 1~999 사이의 숫자만 입력 가능합니다.");
			return false;
		}

		if (confirm("장바구니에 담겠습니까?")) {
			frm.submit();
		} else {
			return false;
		}
	}
</script>
<style type="text/css">
table.table {
	width: 100%;
	border-collapse: collapse;
}

table.table th, table.table td {
	padding: 8px 12px;
	text-align: center; /* 가로 중앙 정렬 */
	vertical-align: middle; /* 세로 중앙 정렬 */
	border: none; /* ← 테두리 없앰 */
	background-color: transparent; /* 배경색도 제거 */
}

table.table thead {
	background-color: #fddf83; /* table-warning 비슷하게 */
}

.welcome-msg {
	font-size: 10px;
	margin: 0;
	padding-top: 4px;
	color: #555;
}

.menu-table {
	background-color: #fffbea;
	border-radius: 8px;
	padding: 10px;
	margin-bottom: 30px;
}

.menu-table td {
	padding: 15px 10px;
	text-align: center;
	font-size: 14px;
}

.menu-link {
	display: inline-block;
	width: 100%;
	padding: 10px;
	border-radius: 6px;
	background-color: #f8f9fa;
	transition: all 0.3s ease;
	color: #212529;
	font-weight: 500;
	text-decoration: none;
}

.menu-link:hover {
	background-color: #ffd43b;
	color: #000;
	text-decoration: none;
}

.menu-link i {
	margin-right: 6px;
}

.section-title {
	font-weight: bold;
	font-size: 16px;
	margin-bottom: 10px;
}

.paging {
	color: black;
	text-decoration: none;
}

.currentPaging {
	color: blue;
	text-decoration: none;
}

.login {
	background-color: #007BFF; /* 파란색 */
	color: white; /* 글자색 흰색 */
	border: none; /* 테두리 제거 */
	padding: 10px 20px; /* 여백 */
	border-radius: 5px; /* 모서리 둥글게 */
	cursor: pointer; /* 커서 변경 */
	transition: transform 0.2s ease, background-color 0.2s ease;
}

.login:hover {
	transform: scale(1.05); /* 살짝 커짐 */
	background-color: #0056b3; /* 더 진한 파란색으로 변경 */
}
</style>
</head>
<body>
	<div class="container" style="width: 800px; margin: auto;">
		<div th:replace="~{layouts/header.html}"></div>

		<!-- 💡 로그인 필요없는 메뉴 -->
		<div class="menu-table">
			<div class="section-title">🔓 일반 메뉴</div>
			<table class="table mb-0">
				<tr>
					<td><th:block th:if="${session.managerId == null}">
							<a href="loginForm" class="menu-link"> 
								<i class="fas fa-sign-in-alt"></i> 로그인
							</a>
						</th:block> 
						<th:block th:if="${session.managerId != null}">
							<a href="logout" class="menu-link"> 
								<i class="fas fa-sign-out-alt"></i> 로그아웃
							</a>
							<p class="welcome-msg mt-1 mb-0" style="font-size: 11px;">
								<th:block th:if="${session.code > 0}">
					            	관리자 [[${session.managerId}]]님 환영합니다.
					            </th:block>
								<th:block th:if="${session.code == 0}">
					            	회원 [[${session.managerId}]]님 환영합니다.
					            </th:block>
							</p>
						</th:block>
					</td>
					<td><a href="mapSearchForm" class="menu-link"> 
							<i class="fas fa-map-marker-alt"></i> 점포찾기
						</a></td>
					<td><a href="introduceForm" class="menu-link"> 
							<i class="fas fa-building"></i> 회사소개
						</a></td>
					<td><a href="noticeList" class="menu-link"> 
							<i class="fas fa-bullhorn"></i> 공지사항
						</a></td>
					<td><a href="helpForm" class="menu-link"> 
							<i class="fas fa-headset"></i> 고객센터
						</a></td>
				</tr>
			</table>
		</div>
		<h3 align="center" style="margin: 30px 0 20px;">🛒 상품목록</h3>

		<!-- 🔹 카테고리 선택 메뉴 -->
		<table style="width: 100%; text-align: center; margin-bottom: 20px;">
			<tr>
				<td><a class="menu-link" th:href="@{productList(cat='음료')}">음료</a>
				</td>
				<td><a class="menu-link" th:href="@{productList(cat='라면')}">라면</a>
				</td>
				<td><a class="menu-link" th:href="@{productList(cat='과자')}">과자</a>
				</td>
				<td><a class="menu-link" th:href="@{productList(cat='즉석식품')}">즉석식품</a>
				</td>
				<td><a class="menu-link" href="productList">전체</a></td>
			</tr>
		</table>

		<!-- 🔹 상품 리스트 테이블 -->
		<table class="table"
			style="background: #fff; border-radius: 10px; 
				box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05); overflow: hidden;">

			<thead style="background-color: #f9f9f9; font-weight: bold;">
				<tr>
					<th>이미지</th>
					<th>상품명</th>
					<th>카테고리</th>
					<th>가격</th>
					<th>장바구니담기</th>
					<th>즉시구매</th>
				</tr>
			</thead>

			<tbody>
				<tr th:each="dto : ${list}" style="border-top: 1px solid #eee;">
					<td>
						<a th:href="@{productView(pdname=${dto.pdname},pg=${pg})}">
							<img th:src="|/storage/${dto.image1}|" alt="상품이미지" 
								width="50" style="border-radius: 4px;">
						</a>
					</td>
					<td>[[${dto.pdname}]]</td>
					<td>[[${dto.cat}]]</td>
					<td>[[${dto.price}]]원</td>
					<td>
						<form action="shoppingBasket" method="post" name="frm">
							<input type="hidden" name="pdname" th:value="${dto.pdname}">
							<input type="hidden" name="price" th:value="${dto.price}">
							<input type="hidden" name="cat" th:value="${dto.cat}"> 
							<input type="hidden" name="pg" th:value="${pg}"> 
							<input type="number" name="qty" value="1" min="1" max="999" size="4"
							       style="text-align: center; border: 1px solid #ccc; border-radius: 4px;">
							<input type="button" class="login" value="담기"
								onclick="inputCheck(this.form)">
						</form>
					</td>
					<td>
						<form action="productPurchase" method="post" name="frm">
							<input type="hidden" name="pdname" th:value="${dto.pdname}">
							<input type="hidden" name="price" th:value="${dto.price}">
							<input type="number" name="qty" value="1" min="1" max="999" size="4"
							       style="text-align: center; border: 1px solid #ccc; border-radius: 4px;">
							<input type="button" class="login" 
								onclick="really(this.form)" value="구매">
						</form>
					</td>
				</tr>
				
				<!-- 🧩 항목이 5개보다 적으면 빈 줄로 채움 -->
				<tr th:if="${list != null and list.size() < 5}"
					th:each="i : ${#numbers.sequence(1, 5 - list.size())}">
					<td>&nbsp;</td>
					<td></td>
					<td></td>
					<td></td>
					<td></td>
					<td></td>
				</tr>
			</tbody>

			<!-- 🔹 페이지네이션 -->
			<tfoot>
				<tr align="center">
					<td colspan="6" style="padding: 15px;">
						<th:block th:if="${startPage > 3}">
							<a class="paging" 
								th:href="@{productList(pg=${startPage-1},cat=${cat})}">
									이전
							</a>&nbsp;&nbsp;
        				</th:block> 
        				<th:block 
        					th:each="i : ${#numbers.sequence(startPage, endPage)}">
								<a th:class="${pg == i} ? 'currentPaging' : 'paging'"
									th:href="@{productList(pg=${i},cat=${cat})}">
										[[${i}]]
								</a>&nbsp;&nbsp;
        				</th:block> 
        				<th:block th:if="${endPage < totalP}">
							<a class="paging"
								th:href="@{productList(pg=${endPage+1},cat=${cat})}">
									다음
							</a>
						</th:block>
					</td>
				</tr>
				<tr>
					<td colspan="6" style="text-align: right; padding: 10px;">
						<th:block th:if="${session.code > 0}">
							<input type="button" value="상품추가"
								onclick="location.href='productWriteForm'" 
									class="login">
						</th:block>
					</td>
				</tr>
			</tfoot>
		</table>

		<div class="menu-table" style="background-color: #e3f7ff;">
			<div class="section-title">🔐 로그인 후 이용 가능</div>
			<table class="table mb-0">
				<tr>
					<td><a onclick="location.href='mypage'" class="menu-link">
							<i class="fas fa-user-circle"></i> 마이페이지
						</a></td>
					<td><a onclick="location.href='shoppingBasketList'"
							class="menu-link"> 
								<i class="fas fa-shopping-cart"></i> 장바구니
						</a></td>
					<td><a onclick="location.href='productList'" class="menu-link">
							<i class="fas fa-boxes"></i> 상품발주
						</a></td>
					<td><a onclick="location.href='orderingList'"
							class="menu-link"> 
								<i class="fas fa-clipboard-list"></i> 발주현황
						</a></td>
				</tr>
			</table>
		</div>
		<div th:replace="~{layouts/footer.html}"></div>
	</div>
</body>
</html>
