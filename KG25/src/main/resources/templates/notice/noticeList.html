<style type="text/css">
table.table {
	width: 100%;
	border-collapse: collapse;
}

table.table th, table.table td {
	padding: 8px 12px;
	text-align: center; /* 가로 중앙 정렬 */
	vertical-align: middle; /* 세로 중앙 정렬 */
	border: none; /* ← 테두리 없앰 */
	background-color: transparent; /* 배경색도 제거 */
}

table.table thead {
	background-color: #fddf83; /* table-warning 비슷하게 */
}

.logx {
	color: black;
	text-decoration: none;
}

.logx:hover {
	color: blue;
	text-decoration: underline;
}

.welcome-msg {
	font-size: 10px;
	margin: 0;
	padding-top: 4px;
	color: #555;
}

.menu-table {
	background-color: #fffbea;
	border-radius: 8px;
	padding: 10px;
	margin-bottom: 30px;
}

.menu-table td {
	padding: 15px 10px;
	text-align: center;
	font-size: 14px;
}

.menu-link {
	display: inline-block;
	width: 100%;
	padding: 10px;
	border-radius: 6px;
	background-color: #f8f9fa;
	transition: all 0.3s ease;
	color: #212529;
	font-weight: 500;
	text-decoration: none;
}

.menu-link:hover {
	background-color: #ffd43b;
	color: #000;
	text-decoration: none;
}

.menu-link i {
	margin-right: 6px;
}

.section-title {
	font-weight: bold;
	font-size: 16px;
	margin-bottom: 10px;
}

.paging {
	color: black;
	text-decoration: none;
}

.currentPaging {
	color: blue;
	text-decoration: underline;
}

.login {
	background-color: #007BFF; /* 파란색 */
	color: white; /* 글자색 흰색 */
	border: none; /* 테두리 제거 */
	padding: 10px 20px; /* 여백 */
	border-radius: 5px; /* 모서리 둥글게 */
	cursor: pointer; /* 커서 변경 */
	transition: transform 0.2s ease, background-color 0.2s ease;
}

.login:hover {
	transform: scale(1.05); /* 살짝 커짐 */
	background-color: #0056b3; /* 더 진한 파란색으로 변경 */
}
</style>
</head>
<body>
	<div class="container" style="width: 800px; margin: auto;">
		<div th:replace="~{layouts/header.html}"></div>

		<!-- 💡 로그인 필요없는 메뉴 -->
		<div class="menu-table">
			<div class="section-title">🔓 일반 메뉴</div>
			<table class="table mb-0">
				<tr>
					<td><th:block th:if="${session.managerId == null}">
							<a href="loginForm" class="menu-link"> 
								<i class="fas fa-sign-in-alt"></i> 로그인
							</a>
						</th:block> 
						<th:block th:if="${session.managerId != null}">
							<a href="logout" class="menu-link"> 
								<i class="fas fa-sign-out-alt"></i> 로그아웃
							</a>
							<p class="welcome-msg mt-1 mb-0" style="font-size: 11px;">
								<th:block th:if="${session.code > 0}">
              						관리자 [[${session.managerId}]]님 환영합니다.
            					</th:block>
								<th:block th:if="${session.code == 0}">
              						회원 [[${session.managerId}]]님 환영합니다.
            					</th:block>
							</p>
						</th:block>
					</td>
					<td><a href="mapSearchForm" class="menu-link"> 
					<i class="fas fa-map-marker-alt"></i> 점포찾기
						</a>
					</td>
					<td><a href="introduceForm" class="menu-link"> 
					<i class="fas fa-building"></i> 회사소개
						</a>
					</td>
					<td><a href="noticeList" class="menu-link"> 
					<i class="fas fa-bullhorn"></i> 공지사항
						</a>
					</td>
					<td><a href="helpForm" class="menu-link"> 
					<i class="fas fa-headset"></i> 고객센터
						</a>
					</td>
				</tr>
			</table>
		</div>
		<h3 align="center" style="margin-bottom: 25px; color: #333;">📢공지사항
		</h3>

		<table class="table"
			style="width: 100%; border: 1px solid #eee; 
			border-radius: 8px; 
			overflow: hidden; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
			background-color: #fff;">
			<thead style="background-color: #fff3cd;">
				<tr style="font-weight: bold; font-size: 15px;">
					<th style="padding: 12px;">번호</th>
					<th style="padding: 12px;">제목</th>
					<th style="padding: 12px;">작성자</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="dto : ${list}"
					style="border-bottom: 1px solid #f1f1f1;">
					<td style="padding: 12px;">[[${dto.seq}]]</td>
					<td style="padding: 12px; text-align: left;">
					<a th:href="@{noticeView(pg=${pg},seq=${dto.seq})}"
						style="color: #007bff; text-decoration: none;">
							[[${dto.subject}]] </a></td>
					<td style="padding: 12px;">[[${dto.id}]]</td>
				</tr>
				
				<!-- 🧩 항목이 5개보다 적으면 빈 줄로 채움 -->
				<tr th:if="${list != null and list.size() < 5}"
					th:each="i : ${#numbers.sequence(1, 5 - list.size())}">
					<td>&nbsp;</td>
					<td></td>
					<td></td>
				</tr>
			</tbody>
			<tfoot>
				<tr>
					<td colspan="3" align="center" style="padding: 20px;">
						<th:block th:if="${startPage > 3}">
							<a th:href="@{noticeList(pg=${startPage-1})}" 
								class="paging">이전</a>&nbsp;&nbsp;
	        			</th:block> 
	        			<th:block th:each="i : ${#numbers.sequence(startPage, endPage)}">
							<a th:href="@{noticeList(pg=${i})}"
								th:class="${pg == i} ? 'currentPaging' : 'paging'"
									style="margin: 0 5px;">[[${i}]]</a>
						</th:block> 
						<th:block th:if="${endPage < totalP}">
							<a th:href="@{noticeList(pg=${endPage+1})}" 
								class="paging">다음</a>
						</th:block>
					</td>
				</tr>
			</tfoot>
		</table>

		<div style="text-align: right; margin-top: 15px;">
			<th:block th:if="${session.code > 0}">
				<input type="button" value="공지 올리기" class="login"
					onclick="location.href='noticeWriteForm'">
			</th:block>
		</div>
		<div th:replace="~{layouts/footer.html}"></div>
	</div>
</body>
</html>
