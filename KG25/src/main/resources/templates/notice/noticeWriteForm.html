<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script type="text/javascript" src="/js/noticeScript.js"></script>
<style type="text/css">
table.table {
	width: 100%;
	border-collapse: collapse;
}

table.table th, table.table td {
	padding: 8px 12px;
	text-align: center; /* 가로 중앙 정렬 */
	vertical-align: middle; /* 세로 중앙 정렬 */
	border: none; /* ← 테두리 없앰 */
	background-color: transparent; /* 배경색도 제거 */
}

table.table thead {
	background-color: #fddf83; /* table-warning 비슷하게 */
}

.logx {
	color: black;
	text-decoration: none;
}

.logx:hover {
	color: blue;
	text-decoration: underline;
}

.welcome-msg {
	font-size: 10px;
	margin: 0;
	padding-top: 4px;
	color: #555;
}

.menu-table {
	background-color: #fffbea;
	border-radius: 8px;
	padding: 10px;
	margin-bottom: 30px;
}

.menu-table td {
	padding: 15px 10px;
	text-align: center;
	font-size: 14px;
}

.menu-link {
	display: inline-block;
	width: 100%;
	padding: 10px;
	border-radius: 6px;
	background-color: #f8f9fa;
	transition: all 0.3s ease;
	color: #212529;
	font-weight: 500;
	text-decoration: none;
}

.menu-link:hover {
	background-color: #ffd43b;
	color: #000;
	text-decoration: none;
}

.menu-link i {
	margin-right: 6px;
}

.section-title {
	font-weight: bold;
	font-size: 16px;
	margin-bottom: 10px;
}

.login {
	background-color: #007BFF; /* 파란색 */
	color: white; /* 글자색 흰색 */
	border: none; /* 테두리 제거 */
	padding: 10px 20px; /* 여백 */
	border-radius: 5px; /* 모서리 둥글게 */
	cursor: pointer; /* 커서 변경 */
	transition: transform 0.2s ease, background-color 0.2s ease;
}

.login:hover {
	transform: scale(1.05); /* 살짝 커짐 */
	background-color: #0056b3; /* 더 진한 파란색으로 변경 */
}
</style>
</head>
<body>
	<div class="container" style="width: 800px; margin: auto;">
		<div th:replace="~{layouts/header.html}"></div>

		<!-- 💡 로그인 필요없는 메뉴 -->
		<div class="menu-table">
			<div class="section-title">🔓 일반 메뉴</div>
			<table class="table mb-0">
				<tr>
					<td><th:block th:if="${session.managerId == null}">
							<a href="loginForm" class="menu-link"> 
								<i class="fas fa-sign-in-alt"></i> 로그인
							</a>
						</th:block> 
						<th:block th:if="${session.managerId != null}">
							<a href="logout" class="menu-link"> 
								<i class="fas fa-sign-out-alt"></i> 로그아웃
							</a>
							<p class="welcome-msg mt-1 mb-0" style="font-size: 11px;">
								<th:block th:if="${session.code > 0}">
              						관리자 [[${session.managerId}]]님 환영합니다.
           		 				</th:block>
								<th:block th:if="${session.code == 0}">
              						회원 [[${session.managerId}]]님 환영합니다.
            					</th:block>
							</p>
						</th:block>
					</td>
					<td><a href="mapSearchForm" class="menu-link"> 
							<i class="fas fa-map-marker-alt"></i> 점포찾기
						</a>
					</td>
					<td><a href="introduceForm" class="menu-link"> 
							<i class="fas fa-building"></i> 회사소개
						</a>
					</td>
					<td><a href="noticeList" class="menu-link"> 
							<i class="fas fa-bullhorn"></i> 공지사항
						</a>
					</td>
					<td><a href="helpForm" class="menu-link"> 
							<i class="fas fa-headset"></i> 고객센터
						</a>
					</td>
				</tr>
			</table>
		</div>
		<div class="container">
			<form action="noticeWrite" method="post" name="frm"
				enctype="multipart/form-data" style="max-width: 600px; margin: 0 auto;">
				<input type="hidden" name="id" th:value="${session.managerId}">

				<table class="table"
					style="width: 100%; background-color: #fff; 
						box-shadow: 0 0 8px rgba(0, 0, 0, 0.05); border-radius: 8px;
							 overflow: hidden;">

					<tr>
						<th style="width: 100px; background-color: #f8f9fa; 
							text-align: right; padding-right: 10px;">제목</th>
						<td style="padding: 12px;"><input type="text" name="subject"
							size="50"	style="width: 100%; padding: 8px; 
								border: 1px solid #ccc; border-radius: 4px;">
						</td>
					</tr>

					<tr>
						<th style="background-color: #f8f9fa; text-align: right; 
							padding-right: 10px;">내용</th>
						<td style="padding: 12px;">
							<textarea rows="10" cols="48" name="content"
								style="width: 100%; padding: 8px; 
									border: 1px solid #ccc; border-radius: 4px; 
										resize: vertical;">
							</textarea>
						</td>
					</tr>

					<tr>
						<th style="background-color: #f8f9fa; text-align: right; 
							padding-right: 10px;">이미지</th>
						<td style="padding: 12px;">
							<input type="file" name="img1" class="login" 
								style="width: 100%; border: 1px solid #ccc; 
									padding: 6px; border-radius: 4px;">
						</td>
					</tr>

					<tr>
						<td colspan="2" style="text-align: center; padding: 20px;">
							<input type="button" value="글쓰기" class="login"
								onclick="checkInputNotice()"> 
							<input type="reset" value="다시작성" class="login">
						</td>
					</tr>
				</table>
			</form>
		</div>

		<div th:replace="~{layouts/footer.html}"></div>
	</div>
</body>
</html>
